<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>ACES Jersey Form</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="logo">
  <img id="logoImg" src="logo2.png" alt="ACES logo">
</div>


<h1>ACES Jersey Order Form</h1>

<form id="jerseyForm">

<!-- PLAYER INFO -->
<h2>Player Information</h2>

<input id="firstName" type="text" placeholder="First Name" required>
<input id="lastName" type="text" placeholder="Last Name" required>
<input id="phone" type="tel" placeholder="Phone Number" required>
<input id="jerseyName" type="text" placeholder="Name on Jersey" required>

<label>Jersey Number</label>
<select id="jerseyNumber" required>
<option value="">Select Number</option>
</select>

<label>Number of Additional Jerseys</label>
<select id="jerseyCount">
<option value="">Select Number</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>


<label>Jersey Size(US Size)</label>
<select id="jerseySize" required>
<option value="">Select Size</option>
<option>Kid's size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<!-- SIZE GUIDE -->
<h2>Size Guide</h2>

<div class="img-box">
  <p>Size Chart</p>
  <img src="Size chart.png" alt="Size Chart">
</div>

<label>Sleeve Type</label>
<select id="sleeve" required>
<option value="">Select Sleeve</option>
<option>Half Sleeve</option>
<option>Full Sleeve</option>
<option>Both</option>
</select>

<label>Bottom Size(US Size)</label>
<select id="pantSize" required>
<option value="">Select Size</option>
<option>Kid's size</option>
<option>XXS</option>
<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<!-- SIZE GUIDE -->
<h2>Size Guide(Bottom)</h2>

<div class="img-box">
  <p>Size Chart</p>
  <img src="pants.jpg" alt="Size Chart">
</div>

<label>Number of Caps</label>
<select id="capCount">
<option value="">Select Number</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>


<!-- ADDITIONAL JERSEYS -->
<h2>Additional Jerseys</h2>

<label>Do you want additional jerseys?</label>
<select id="extraToggle">
<option value="no">No</option>
<option value="yes">Yes</option>
</select>

<div id="extraSection" class="hidden">

<label>Number of Additional Jerseys</label>
<select id="extraCount">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>

<div id="extraContainer"></div>

</div>

<button type="submit">Submit Order</button>

</form>

<!-- THANK YOU SCREEN -->
<div id="thankYouBox" class="hidden thank-you">
  <h2> Thank You!</h2>
  <p>Your jersey order has been submitted successfully.</p>
  <button id="editBtn">Edit Response</button>
</div>

</div>

<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImg" alt="Enlarged size chart">
</div>

<footer class="footer">
  &copy; ACES Cricket Club 2026.
</footer>



<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
